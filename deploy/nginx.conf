# Office Jukebox behind nginx — TLS, sub-path (/jukebox/) and WebSockets.
# Jukebox env: TRUSTED_PROXIES=<nginx IP or subnet>   (BASE_PATH not needed: nginx strips the prefix)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name music.example.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # "/jukebox" -> "/jukebox/" so the app's relative URLs resolve
    location = /jukebox { return 308 /jukebox/; }

    location /jukebox/ {
        proxy_pass http://192.168.1.50:8080/;          # trailing slash strips /jukebox
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket (/api/ws)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /jukebox;    # used for the cookie path
        proxy_read_timeout 1h;                           # keep idle WebSockets open
        proxy_buffering off;

        # --- Optional SSO (e.g. Authelia/authentik forward-auth) ----------
        # auth_request /authelia;
        # auth_request_set $user  $upstream_http_remote_user;
        # auth_request_set $groups $upstream_http_remote_groups;
        # proxy_set_header Remote-User   $user;          # jukebox: AUTH_HEADER=Remote-User
        # proxy_set_header Remote-Groups $groups;        # jukebox: AUTH_GROUPS_HEADER=Remote-Groups
        # Never forward a client-supplied identity header:
        # (with auth_request the values above always overwrite it)
    }
}

# Serving at the root of its own host instead? Use `location / { proxy_pass http://192.168.1.50:8080; ... }`
# with the same headers and no X-Forwarded-Prefix.
