<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Rolola: the shared office jukebox. Search, queue and vote on the music playing in the office.">
  <title>Rolola</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const th = localStorage.getItem('jb.theme'); if (th && th !== 'auto') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="off"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>Rolola needs JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
