# Office Jukebox — single service. `docker compose up -d`
services:
  jukebox:
    image: ghcr.io/aa-eion/rolola:1.0.0   # or: build: .
    build: .
    container_name: jukebox
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/snd:/dev/snd                  # the host sound card(s)
    group_add:
      - "29"                               # GID of the host "audio" group (getent group audio)
    volumes:
      - ./data:/data                       # database, settings, cache, credentials (back this up)
      - /mnt/tank/media/music:/music:ro    # your music library (read-only)
    environment:
      TZ: "America/Bogota"
      AUDIO_DEVICE: "plughw:CARD=Generic_1,DEV=0"   # by card NAME, never by index
      # ADMIN_PASSWORD: "change-me"       # else one is generated into /data/admin-password.txt
      # BASE_PATH: "/jukebox"             # when served under a sub-path
      # TRUSTED_PROXIES: "172.16.0.0/12,192.168.1.10"
      # AUTH_HEADER: "Remote-User"        # trust SSO identity from the proxy
      # ADMIN_GROUPS: "jukebox-admins"
      # AUTH_GROUPS_HEADER: "Remote-Groups"
      JUKEBOX_DEFAULT_LANGUAGE: "es"
    # Optional: let mpv run with higher priority than everything else.
    # cap_add: [SYS_NICE]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
